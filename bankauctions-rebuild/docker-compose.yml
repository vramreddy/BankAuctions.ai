version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bankauctions_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankauction_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bankauctions_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankadmin -d bankauctions_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bankauctions_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://bankadmin:bankauction_secret_2026@postgres:5432/bankauctions_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-bankauctions_jwt_super_secret_key_2026_commercial}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
